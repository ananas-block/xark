<!doctype html>
<meta charset="utf-8">
<title>xark-wasm streaming prover — browser test</title>
<pre id="out">running…</pre>
<script type="module">
  const w = new Worker(new URL("./coordinator.mjs", import.meta.url), { type: "module" });
  w.onmessage = async (e) => {
    document.getElementById("out").textContent = JSON.stringify(e.data, null, 2);
    await fetch("/result", { method: "POST", body: JSON.stringify(e.data) });
  };
  w.onerror = (e) => fetch("/result", { method: "POST", body: JSON.stringify({ error: e.message }) });
  w.postMessage("go");
</script>
