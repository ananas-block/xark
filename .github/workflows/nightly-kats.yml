name: Nightly KATs (known-answer vectors)

# The compiler snapshot suite and the ed25519 gadget carry heavy correctness
# tests that check real hash / curve output against published test vectors:
#   * `crates/lang/tests/snapshot.rs` `#[ignore]`d KATs — SHA-256("abc"),
#     keccak256("") and the 2-block keccak256(bytes(0..200)) vector, the
#     variable-length sha256/blake2s/blake3 vectors, the secp256k1/r1 2G·3G
#     incomplete-EC vectors, and the Keccak/AES Lean-model gate-count bridges;
#   * `gadgets/xark-ed25519/tests/vec.rs` — scalar-mul cross-checks + EdDSA
#     verify/tamper, which each solve a full non-native EC hint program.
# They take minutes (some circuits are >150k constraints), so they run on a
# schedule and on demand rather than on every push. The fast snapshot suite
# (byte-exact gate counts, no KAT solving) runs per-push in `ci.yml`.

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:

jobs:
  semantics-fuzz-long:
    # The native-semantics fuzzer at depth: random circuits checked against Rust,
    # each input decided by exhaustive witness search (no forged witness, exactly
    # one honest one). A new seed every run; a failure prints it for reproduction
    # (`XARK_FUZZ_SEED=<seed> XARK_FUZZ_CASES=5000`).
    name: semantics fuzz (5,000 programs, rotating seed)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install stable Rust + wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/lang
      - name: cargo test (semantics fuzz)
        env:
          XARK_FUZZ_CASES: "5000"
          XARK_FUZZ_SEED: ${{ github.run_id }}
        run: cd crates/lang && cargo test --release --test semantics_fuzz -- --nocapture

  compiler-kats:
    name: compiler KAT vectors (nightly, --include-ignored)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust + wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry, git, and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/lang/target
          key: kats-${{ hashFiles('Cargo.lock') }}

      - name: cargo test (snapshots + ignored KAT vectors)
        # `--include-ignored` runs the fast snapshot tests AND the heavy
        # known-answer-vector tests in one pass.
        run: cd crates/lang && cargo test --release --test snapshot -- --include-ignored

  ec-gadget-vectors:
    name: heavy EC gadget vectors (ed25519 + secp256k1/r1, release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust + wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry, git, and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/lang/target
          key: ed25519-${{ hashFiles('Cargo.lock') }}

      - name: cargo test (heavy EC gadget vectors, release)
        # Release is mandatory: the non-native EC solves are 10–50× slower in
        # debug (see the release-mode note in the repo). These heavy KATs live
        # here (too slow for the quick `ci.yml` step).
        #
        # No swapfile: these KATs used to peak ~12 GB (OOM-killed on the 7 GB
        # runner) because the harness materialized the flat R1CS to solve/analyze
        # and the constraint-count pins ran a full expand+minimize. They now
        # stream — `check()`/`check_named` solve+analyze straight from `circuit.xbc`
        # (never the flat system), and the count pins are a streamed digest — so
        # the peak is the compiler subprocess (~5 GB), well under the runner.
        run: cargo test -p xark-ed25519 -p xark-secp256k1 -p xark-secp256r1 --release

  toolchain-drift:
    # Early warning for a Rust release that would change a circuit (and so break
    # every key made for it): rebuild every example with today's stable, beta and
    # nightly and compare with tests/stable-digests.txt. `ci.yml` runs the same
    # check on 1.89/stable/beta, but only when something is pushed; this catches a
    # new beta or nightly weeks before it becomes stable. Nightly is a canary, not
    # a supported toolchain — see "Toolchain policy" in docs/toolchain.md.
    name: circuit digests on ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta, nightly]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install workspace toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install toolchain under test
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --target wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Compare circuit digests
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
        run: scripts/stable-digests.sh --check

  example-sweep:
    # Every example on its own test inputs, plus single-leaf mutations of them,
    # each decided by exhaustive witness search: exactly one witness where the
    # test accepts, none where it rejects (scripts/difftest-examples.sh). Split
    # into four shards that run side by side; a failure names the example and the
    # input. A whole-ed25519 search peaks near 7 GB.
    name: adversarial example sweep (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install stable Rust + wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Sweep this shard's examples
        env:
          XARK_SWEEP_SHARD: ${{ matrix.shard }}/4
          XARK_SWEEP_JOBS: "2"
        run: scripts/difftest-examples.sh
