[package]
name = "zk_kyc"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[dependencies]
xark = { path = "../../crates/lang", version = "0.3.0", default-features = false }
xark-poseidon2 = { path = "../../gadgets/xark-poseidon2", version = "0.3.0" }

[dev-dependencies]
poseidon2 = "0.0.1"
ark-bn254 = "0.6"
ark-ff = "0.6.0"
hex = "0.4.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }
